# =============================================================================
# Root compose — the whole booking slice, runnable from the repo root:
#
#     docker compose up --build            # everything: infra + gateway + 5 services
#     docker compose up --build gateway    # gateway pulls in the services it proxies to
#
# The gateway is the ONLY host-published application port (:8080) — ADR-0006 puts every external
# request through it (OIDC validation, correlation, rate limiting). The five services below listen
# on :8080 INTERNALLY and publish no host ports; reach them only via the gateway. Keycloak moves to
# host :8088 so the gateway can own the canonical :8080 (see infra/docker-compose.yml).
#
# Platform infra (Postgres, RabbitMQ, Mailhog, Keycloak, Vault, observability) lives in
# infra/docker-compose.yml and is pulled in via `include`. Bringing up only the app services
# starts just their dependencies (Postgres/RabbitMQ/Mailhog/stripe-mock) and leaves the heavier
# infra (Keycloak/Vault/Grafana stack) down unless you ask for it.
#
# Each service builds from the REPO ROOT context (its Dockerfile COPYs shared/ — see the service
# Dockerfiles). Migrations are applied by the one-shot `migrate` container, because the services
# do not migrate themselves. `stripe-mock` lets payment's createPayment succeed offline; the
# webhook is driven by a locally-signed request (see the e2e script / STRIPE_WEBHOOK_SECRET).
# =============================================================================
name: booking-platform

include:
  - infra/docker-compose.yml

x-postgres-url: &pg "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432"
x-rabbit-url: &amqp "${RABBITMQ_URL:-amqp://booking:booking_dev_pw@rabbitmq:5672}"

services:
  # One-shot schema setup. App services wait for it to complete successfully.
  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_dev_pw}
    volumes:
      - ./:/repo:ro
    entrypoint: ["/bin/sh", "/repo/infra/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Stripe API stand-in so createPayment works with no network and no real keys.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"

  # The API gateway is the ONLY host-published application port (ADR-0006, ADR-0012). Every external
  # request enters here on :8080; the gateway validates the Keycloak OIDC token, mints/propagates the
  # correlation id, rate-limits per subject, and reverse-proxies to the internal services below —
  # which publish NO host ports of their own. The Stripe webhook is the sole unauthenticated route
  # (Stripe signs its own payloads; payment verifies the signature).
  #
  # OIDC_ISSUER vs OIDC_JWKS_URL are deliberately different hosts: a token is minted where the caller
  # reached Keycloak (host-published :8088, so iss=http://localhost:8088/realms/booking), but the
  # gateway fetches signing keys over the internal network at keycloak:8080. Collapsing the two would
  # reject every real token. The gateway fetches the JWKS synchronously at boot and exits if Keycloak
  # is not yet serving keys; `restart: on-failure` retries until the realm import completes.
  gateway:
    restart: on-failure
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8088/realms/booking}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/booking/protocol/openid-connect/certs}
      OIDC_CLOCK_SKEW: ${OIDC_CLOCK_SKEW:-30s}
      CATALOG_BASE_URL: "http://catalog:8080"
      AVAILABILITY_BASE_URL: "http://availability:8080"
      BOOKING_BASE_URL: "http://booking:8080"
      PAYMENT_BASE_URL: "http://payment:8080"
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      # service_healthy, not just _started: Keycloak's /health/ready passes only after the realm
      # import completes, so the gateway's synchronous boot-time JWKS fetch finds live keys instead
      # of an empty set. `restart: on-failure` above is the backstop if Keycloak blips later.
      keycloak:
        condition: service_healthy
      catalog:
        condition: service_started
      availability:
        condition: service_started
      booking:
        condition: service_started
      payment:
        condition: service_started

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432/catalog?sslmode=disable"
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  availability:
    restart: on-failure
    build:
      context: .
      dockerfile: services/availability/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432/availability?sslmode=disable"
      RABBITMQ_URL: *amqp
      HTTP_ADDR: ":8080"
      BOOKING_HOLD_TTL_SECONDS: ${BOOKING_HOLD_TTL_SECONDS:-900}
      AVAILABILITY_SWEEP_INTERVAL_SECONDS: ${AVAILABILITY_SWEEP_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  booking:
    restart: on-failure
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432/booking?sslmode=disable"
      RABBITMQ_URL: *amqp
      HTTP_ADDR: ":8080"
      BOOKING_HOLD_TTL_SECONDS: ${BOOKING_HOLD_TTL_SECONDS:-900}
      AVAILABILITY_BASE_URL: "http://availability:8080"
      CATALOG_BASE_URL: "http://catalog:8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  payment:
    restart: on-failure
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432/payment?sslmode=disable"
      RABBITMQ_URL: *amqp
      HTTP_ADDR: ":8080"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dev}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_secret}
      STRIPE_BASE_URL: "http://stripe-mock:12111"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stripe-mock:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  notification:
    restart: on-failure
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_pw}@postgres:5432/notification?sslmode=disable"
      RABBITMQ_URL: *amqp
      HTTP_ADDR: ":8080"
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
      migrate:
        condition: service_completed_successfully
