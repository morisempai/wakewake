name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI reads the repo and nothing else. It has no cloud credentials
# and no write access — deployment happens in separate, environment-gated workflows
# (cicd-conventions: "the pipeline is the only entity that touches the cloud").
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fires on any change to contracts/ — the contract-guardian check from cicd-conventions.
  # Contracts are the source of truth for every service boundary, so an invalid spec must
  # never reach main: services are generated and verified against these files.
  lint-openapi:
    name: Lint OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Pinned to a major range and run via npx. The services are Go (ADR-0008), so there is no
      # Node project here to install from — Node exists solely to run this linter and the
      # AsyncAPI one. That also retires the "we need a lockfile by M2" note from the M1 PR:
      # there will never be Node dependencies to lock.
      - name: Spectral lint
        run: |
          npx --yes @stoplight/spectral-cli@6 lint \
            "contracts/openapi/*.yaml" \
            --ruleset .spectral.yaml \
            --fail-severity=error \
            --display-only-failures

      # A lint rule that matches nothing reports success. Without this step, a typo in a
      # rule's JSONPath would silently disable it and the job above would still go green —
      # manufacturing confidence in checks that aren't running. The fixture violates every
      # custom rule once; each must fire.
      - name: Ruleset self-test — prove the custom rules are not inert
        run: |
          set -o pipefail
          out=$(npx --yes @stoplight/spectral-cli@6 lint \
                  contracts/.spectral-fixtures/violations.yaml \
                  --ruleset .spectral.yaml \
                  --format text 2>&1) || true
          echo "$out"

          missing=0
          for rule in booking-paths-are-versioned \
                      booking-no-verbs-in-paths \
                      booking-snake-case-properties \
                      booking-timestamps-end-in-at \
                      booking-error-envelope-required \
                      booking-security-defined; do
            if echo "$out" | grep -q "$rule"; then
              echo "  fired:  $rule"
            else
              echo "::error::Rule '$rule' did not fire on a fixture that violates it — the rule is inert and is checking nothing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK — all custom rules fire."

  lint-asyncapi:
    name: Lint AsyncAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: AsyncAPI validate
        run: |
          npx --yes @asyncapi/cli@2 validate contracts/asyncapi/booking-events.yaml

  # The services are Go (ADR-0008). This job exists from the moment the module layout does,
  # because go.work and the per-service go.mod files were authored without a Go toolchain
  # available locally — CI is the first thing that actually compiles them. Do not treat their
  # correctness as reviewed until this job has been green once.
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'd:"; echo "$unformatted"
            exit 1
          fi
          echo "OK — gofmt clean."

      # ADR-0009: internal/domain may import shared/contracts (pure types) but NEVER
      # shared/platform, which carries pgx, amqp, and otel. A domain layer that imports a
      # database driver is the layering violation service-template forbids, and it is much
      # cheaper to prevent than to unpick once handlers depend on it.
      #
      # Checked here rather than trusted to review: this is the kind of import someone adds at
      # 5pm to get one thing working, and it never gets removed.
      # Generated code is committed (ADR-0009) so agents can read the types they implement and
      # Docker builds need no codegen step. Committed output rots unless something checks it, so
      # this regenerates and fails on any diff.
      #
      # It also covers the embedded spec copies under shared/contracts/specs/: those are copies
      # of contracts/, and a copy that silently drifts from its source is worse than no copy —
      # the contract tests would keep validating against the stale version and passing.
      - name: Generated contract code is up to date
        run: |
          make contracts-gen
          if ! git diff --quiet shared/contracts/; then
            echo "::error::shared/contracts is stale — run 'make contracts-gen' and commit the result."
            git diff --stat shared/contracts/
            exit 1
          fi
          echo "OK — generated contract code matches contracts/."

      - name: Domain layer must not import shared/platform
        run: |
          violations=$(grep -rln 'shared/platform' --include='*.go' services/*/internal/domain/ 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "::error::internal/domain imports shared/platform (ADR-0009). Domain logic must stay free of pgx/amqp/otel — declare an interface in domain and implement it in infra."
            echo "$violations"
            exit 1
          fi
          echo "OK — no domain package imports shared/platform."

      # `./...` at the workspace root matches nothing: the root is not itself a module, and the
      # pattern does not descend into the modules listed in go.work. Iterate the workspace
      # modules instead — same coverage, correctly expanded. Guard against the module list
      # coming back empty, or this loop would pass by doing nothing at all.
      - name: Build, vet, test each workspace module
        run: |
          set -o pipefail
          mods=$(go list -m -f '{{.Dir}}')
          [ -n "$mods" ] || { echo "::error::go.work lists no modules — this job would check nothing."; exit 1; }

          count=0
          for dir in $mods; do
            echo "::group::$(basename "$dir")"
            ( cd "$dir" && go build ./... && go vet ./... && go test -race ./... )
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Checked $count module(s)."

          # Green above means "the packages compile", NOT "the services work". Services are
          # doc.go placeholders until the per-service agents write them in M2.
          if [ -z "$(git ls-files '*_test.go')" ]; then
            echo "::warning::No Go tests exist yet — M2 has not started. This is not a passing test suite."
          fi

      # Contract tests are behind `//go:build contract`, so the default `go test` above SKIPS
      # them entirely — it reports "[no test files]" and goes green. That is how a drift guard
      # becomes decorative: it exists, it passes locally, and it never runs on any PR.
      #
      # These are the tests that make hand-written AsyncAPI structs safe (ADR-0009). If they are
      # not running, the structs have no guarantee behind them at all.
      - name: Contract tests (-tags contract)
        run: |
          set -o pipefail
          ran=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            # Only modules that actually have contract-tagged files.
            if ! grep -rlq '//go:build contract' "$dir" 2>/dev/null; then
              continue
            fi
            echo "::group::contract: $(basename "$dir")"
            ( cd "$dir" && go test -tags contract -race ./... )
            echo "::endgroup::"
            ran=$((ran + 1))
          done

          # A loop that matched nothing would pass silently — the same failure mode this step
          # exists to prevent. shared/contracts carries the envelope drift tests, so zero here
          # means they were deleted or the tag was renamed, and that must be loud.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No contract-tagged tests were found. The AsyncAPI drift guard is the only thing keeping the hand-written event structs honest (ADR-0009) — if it has vanished, say so rather than passing."
            exit 1
          fi
          echo "Ran contract tests in $ran module(s)."

  # The ADR-0003 concurrency proof and everything else that needs a real database. These use
  # testcontainers, which needs a Docker daemon — present on GitHub runners, absent from the
  # environment this was written in, so CI is the FIRST place these have ever executed.
  #
  # This job is the reason the repo can stop describing the no-double-booking invariant as a
  # claim. Until it went green, "a Postgres exclusion constraint prevents double-booking" and
  # "the constraint must be partial" (ADR-0011) were both prose.
  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Integration tests (-tags integration)
        run: |
          set -o pipefail
          ran=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            if ! grep -rlq '//go:build integration' "$dir" 2>/dev/null; then
              continue
            fi
            echo "::group::integration: $(basename "$dir")"
            ( cd "$dir" && go test -tags integration -race -v -timeout 15m ./... )
            echo "::endgroup::"
            ran=$((ran + 1))
          done

          # Same anti-inert guard as the contract step: a loop over nothing passes while proving
          # nothing, and this is the job that carries the architecture's load-bearing test.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No integration-tagged tests were found. The ADR-0003 concurrency proof lives behind this tag — if it is gone, fail loudly rather than reporting success."
            exit 1
          fi
          echo "Ran integration tests in $ran module(s)."

  # Cheap structural checks that don't need a toolchain. These catch the class of mistake
  # that is invisible in review but breaks a consumer at runtime.
  contract-invariants:
    name: Contract invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Event names are PascalCase facts, not dotted commands
        run: |
          # The api-contracts skill mandates <Entity><PastTenseVerb>. An earlier draft of this
          # repo used dotted lowercase (booking.confirmed); this stops that regressing.
          if grep -rnE '\b(booking|payment|availability|reservation)\.(held|confirmed|cancelled|succeeded|failed|reserved|released)\b' \
              contracts/ services/*/CLAUDE.md; then
            echo "::error::Dotted lowercase event name found. Events are PascalCase <Entity><PastTenseVerb> (api-contracts skill)."
            exit 1
          fi
          echo "OK — no dotted event names."

      - name: No secrets committed
        run: |
          # cicd-conventions: "A secret value appearing in a workflow file, log, or echo is
          # an incident." This repo is public; a real token landing here is unrecoverable.
          if grep -rnE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::Possible real secret committed. Rotate it immediately — this repo is public."
            exit 1
          fi
          echo "OK — no secret patterns found."

      - name: Contracts live where the skill says they live
        run: |
          test -d contracts/openapi || { echo "::error::contracts/openapi/ missing"; exit 1; }
          test -d contracts/asyncapi || { echo "::error::contracts/asyncapi/ missing"; exit 1; }
          # Checked separately: a single `ls` over both paths exits non-zero when EITHER is
          # missing, which would let one stale directory pass unnoticed.
          for stale in contracts/http contracts/events; do
            if [ -e "$stale" ]; then
              echo "::error::Stale path $stale. Use contracts/openapi and contracts/asyncapi (api-contracts skill)."
              exit 1
            fi
          done
          echo "OK — contract layout matches the skill."

  # Placeholder for the real pipeline. cicd-conventions defines the full shape:
  #   lint → unit tests → contract tests → build image → integration tests
  # Only the lint stage can exist today: M1 is contracts, and there is no service code to
  # test or image to build. M2 adds unit/contract jobs per service with paths: filters.
  # This job is deliberately NOT a silent no-op that reports green — it says what is missing.
  pipeline-status:
    name: Pipeline completeness
    runs-on: ubuntu-latest
    steps:
      - name: Report which stages exist
        run: |
          echo "Implemented: lint (OpenAPI, AsyncAPI, invariants), Go build/vet/gofmt"
          echo "Not yet implemented — no service code exists (M2):"
          echo "  - unit tests (the Go test step runs, but there are no _test.go files to run)"
          echo "  - contract tests (provider verification against contracts/openapi/)"
          echo "  - image build"
          echo "  - integration tests (Testcontainers: Postgres + RabbitMQ)"
          echo ""
          echo "The ADR-0003 concurrency proof — two simultaneous reserves of one slot, exactly"
          echo "one wins — is the load-bearing test for this whole architecture and does not"
          echo "exist yet. Do not read a green CI here as evidence the invariant holds."
